<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1518" media="(prefers-color-scheme: dark)">
  <title>Kropka</title>
  <link rel="preload" href="/static/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="description" content="Kropka: oznacz stan punktu jednym kliknięciem">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Kropka">
  <script type="module" src="/static/js/point.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" id="brand"><span id="brand-dot"></span>Kropka</a>
    <div id="lang-switch"></div>
  </header>

  <main class="point-page">
    <!-- Point info. aria-live so screen readers hear the new status after a tap. -->
    <section class="card" id="point-card" aria-live="polite">
      <p id="loading" class="muted" data-i18n="point.loading">Wczytywanie…</p>
      <div id="point-info" hidden>
        <span id="demo-badge" class="badge" data-i18n="point.demo" hidden></span>
        <span id="pending-badge" class="badge" data-i18n="point.pending" hidden></span>
        <h1 id="point-name"></h1>
        <p id="point-address" class="address muted"></p>
        <div class="status-row">
          <span id="status-dot"></span>
          <div>
            <p id="status-text" class="status-text"></p>
            <p id="status-ago" class="muted"></p>
          </div>
        </div>
        <p id="point-meta" class="meta muted small"></p>
        <button id="watch-btn" class="link-btn" type="button" aria-pressed="false"></button>
      </div>
    </section>

    <!-- The three big buttons -->
    <section id="actions" hidden>
      <p class="question" data-i18n="point.question"></p>
      <div class="action-buttons">
        <button class="action" type="button" data-type="took" aria-describedby="took-hint"><span data-icon="low"></span><span data-i18n="action.took"></span></button>
        <p id="took-hint" class="action-hint muted small" data-i18n="point.took_disabled" hidden></p>
        <button class="action" type="button" data-type="empty"><span data-icon="empty"></span><span data-i18n="action.empty"></span></button>
        <button class="action" type="button" data-type="refilled"><span data-icon="ok"></span><span data-i18n="action.refilled"></span></button>
      </div>
    </section>

    <!-- Shown after a successful tap -->
    <section id="done" class="card done" role="status" tabindex="-1" hidden>
      <span id="done-dot"></span>
      <h2 data-i18n="done.title"></h2>
      <p id="done-text"></p>
      <a class="btn" id="open-map" href="/" data-i18n="point.open_map"></a>
    </section>

    <p id="message" class="message" role="alert" hidden></p>

    <p class="privacy muted small" data-i18n="point.privacy"></p>
  </main>
</body>
</html>
