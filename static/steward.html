<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1518" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Kropka: punkty, którymi się opiekujesz">
  <title>Kropka · moje punkty</title>
  <link rel="preload" href="/static/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <script type="module" src="/static/js/steward.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span id="brand-dot"></span>Kropka</a>
    <div class="topbar-controls">
      <a class="btn secondary small-btn" href="/" data-i18n="dash.back_to_map">Mapa</a>
      <label class="visually-hidden" for="lang-select" data-i18n="lang.label">Język</label>
      <select id="lang-select" class="pill-select"></select>
    </div>
  </header>

  <main class="page">
    <h1 data-i18n="steward.title">Moje punkty</h1>
    <p class="muted" data-i18n="steward.intro"></p>

    <!-- Simulated notification: appears when a point I look after becomes empty -->
    <div id="alerts" class="alerts" role="alert" aria-live="assertive"></div>
    <p id="message" class="message" role="status" hidden></p>

    <p id="empty-state" class="card muted" data-i18n="steward.empty" hidden></p>
    <ul id="list" class="watch-list"></ul>

    <p class="muted small" data-i18n="steward.privacy"></p>
  </main>
</body>
</html>
